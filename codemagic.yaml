
workflows:
  android-debug:
    name: My Daily Hisab Debug APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Check Android Project
        script: |
          echo "Checking Android project..."
          ls -la
          test -f gradlew
          test -d app
          echo "Android project files found."

      - name: Build Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients: []
