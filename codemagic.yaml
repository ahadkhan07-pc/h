
workflows:
  android-debug:
    name: My Daily Hisab Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Fix Gradle Wrapper
        script: |
          set -e
          mkdir -p gradle/wrapper

          if [ -f gradle-wrapper.jar ]; then
            cp gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          fi

          if [ -f gradle-wrapper.properties ]; then
            cp gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
          fi

          echo "Checking Gradle wrapper..."
          ls -la gradle/wrapper/
          ls -la gradlew

      - name: Check Gradle
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --version

      - name: Build Debug APK
        script: |
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - "**/build/outputs/apk/**/*.apk"
