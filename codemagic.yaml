
workflows:
  android-debug:
    name: My Daily Hisab Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Check Project Files
        script: |
          echo "Checking project..."
          pwd
          ls -la
          test -f gradlew
          test -f settings.gradle.kts
          echo "Project files verified."

      - name: Check Gradle Modules
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon projects

      - name: Build Debug APK
        script: |
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        script: |
          find . -type f -name "*.apk" -print

    artifacts:
      - "**/build/outputs/apk/**/*.apk"
