
    scripts:
      - name: Inspect Android Folder
        script: |
          echo "Checking Android folder..."
          ls -la android
          find android -maxdepth 3 -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build Debug APK
        script: |
          if [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Android Gradle wrapper not found inside android folder."
            exit 1
          fi

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
