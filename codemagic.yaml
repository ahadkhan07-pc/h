workflows:
  android-debug:
    name: My Daily Hisab Debug APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check Android Project
        script: |
          ls -la
          test -f gradlew
          test -d app

      - name: Build Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
